<script type="text/javascript">
    RED.nodes.registerType('wsl-ubuntu', {
        category: 'function',
        color: '#dd4814',
        defaults: {
            name: { value: "" },
            wslconfig: { value: "", type: "wsl-config" },
            continuous: { value: false },
            initCmd: { value: "" },
            loadProfile: { value: true }
        },
        credentials: {
            sudoPassword: { type: "password" }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",
        label: function () {
            return this.name || "wsl-ubuntu";
        },
        oneditprepare: function () {
            $("#node-input-continuous").prop("checked", this.continuous);
            $("#node-input-loadProfile").prop("checked", this.loadProfile !== false);
        },
        button: {
            visible: function() {
                return this.continuous === true;
            },
            toggle: false,
            icon: "fa-stop",
            label: function() {
                return "Stop";
            },
            onclick: function() {
                $.ajax({
                    url: "wsl-ubuntu/" + this.id + "/kill",
                    type: "POST",
                    success: function(resp) {
                        RED.notify("WSL process terminated", "success");
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        RED.notify("Failed to terminate WSL process: " + errorThrown, "error");
                    }
                });
            }
        }
    });
</script>

<script type="text/html" data-template-name="wsl-ubuntu">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Node name">
    </div>

    <div class="form-row">
        <label for="node-input-wslconfig"><i class="fa fa-linux"></i> WSL Config</label>
        <input type="text" id="node-input-wslconfig">
    </div>

    <div class="form-row">
        <label for="node-input-sudoPassword"><i class="fa fa-lock"></i> Sudo Pass</label>
        <input type="password" id="node-input-sudoPassword">
    </div>

    <div class="form-row">
        <label for="node-input-loadProfile"><i class="fa fa-file-text-o"></i> Shell Init</label>
        <input
        type="checkbox"
        id="node-input-loadProfile"
        style="display: inline-block; width: auto; vertical-align: top;"
        />
        <div class="form-tips">Loads <code>~/.bashrc</code> and <code>/etc/profile</code>, like an Ubuntu terminal.</div>
    </div>

    <div class="form-row">
        <label for="node-input-initCmd"><i class="fa fa-terminal"></i> Pre CMD</label>
        <input type="text" id="node-input-initCmd" placeholder="e.g. source ~/catkin_ws/devel/setup.bash">
        <div class="form-tips">Runs before <code>msg.payload</code>.</div>
    </div>

    <div class="form-row">
        <label for="node-input-continuous"><i class="fa fa-refresh"></i> Continuous</label>
        <input
        type="checkbox"
        id="node-input-continuous"
        style="display: inline-block; width: auto; vertical-align: top;"
        />
        <div class="form-tips">Streams output as it arrives and shows a stop button. For long-running processes (e.g. roscore).</div>
    </div>
</script>

<script type="text/html" data-help-name="wsl-ubuntu">
    <p>A node for executing commands in WSL (Windows Subsystem for Linux) Ubuntu environment.</p>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>WSL Config <span class="property-type">wsl-config</span></dt>
        <dd>Configuration node that specifies which WSL distribution to use. Supports custom distros created via <code>wsl --import</code>.</dd>
    </dl>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd><strong>Required:</strong> Command to execute in the WSL environment.</dd>
        <dt class="optional">kill <span class="property-type">boolean</span></dt>
        <dd>Setting this to true terminates any running process</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>Command execution results</dd>
    </dl>
    <h3>Details</h3>
    <p>When "Continuous" mode is enabled, command output is sent continuously as it becomes available. New commands are rejected while a process is running, and a stop button appears to terminate the process.</p>
    <p>When "Continuous" mode is disabled, command output is sent as a single message after the command completes execution.</p>
    <p>The "Pre CMD" field allows you to specify commands that will be executed before the main command (msg.payload). This is useful for setting up environments or sourcing configuration files.</p>
    <p>"Shell Init" is enabled by default. The command then runs in a login <b>interactive</b> shell (<code>bash -l -i -c</code>), so <code>/etc/profile</code> and <code>~/.bashrc</code> are sourced exactly as they are when you open an Ubuntu terminal. Ubuntu's <code>~/.bashrc</code> exits early for non-interactive shells, so without this anything appended to it (for example <code>source /opt/ros/humble/setup.bash</code>) would be skipped. The login banner (MOTD) is suppressed so it does not appear in the output.</p>
</script>
