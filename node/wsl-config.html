<script type="text/javascript">
    RED.nodes.registerType('wsl-config', {
        category: 'config',
        defaults: {
            name: { value: "" },
            distro: { value: "", required: true },
            sourceType: { value: "existing" },
            sourceFile: { value: "" },
            sourceRelease: { value: "" },
            installLocation: { value: "" },
            imageLocation: { value: "" }
        },
        label: function () {
            return this.name || this.distro || "wsl-config";
        },
        oneditprepare: function () {
            const node = this;

            function loadDistros() {
                $.getJSON("wsl-config/distros", function (distros) {
                    const datalist = $("#wsl-distro-list");
                    datalist.empty();
                    distros.forEach(function (d) {
                        datalist.append($("<option>").val(d.name));
                    });
                });
            }
            loadDistros();

            // Populate the downloadable-image dropdown from the server catalog.
            $.getJSON("wsl-config/images", function (data) {
                const sel = $("#node-config-input-sourceRelease");
                sel.empty();
                sel.append($("<option>").val("").text("-- select an Ubuntu release --"));
                (data.images || []).forEach(function (img) {
                    const opt = $("<option>").val(img.key).text(img.label);
                    if (!img.available) {
                        opt.prop("disabled", true).text(img.label + " (not available for " + data.arch + ")");
                    }
                    sel.append(opt);
                });
                sel.val(node.sourceRelease || "");
            });

            // Show only the inputs relevant to the chosen source type.
            function updateVisibility() {
                const type = $("#node-config-input-sourceType").val();
                $(".wsl-src-file").toggle(type === "file");
                $(".wsl-src-download").toggle(type === "download");
                $(".wsl-src-location").toggle(type === "file" || type === "download");
            }
            $("#node-config-input-sourceType").on("change", updateVisibility);
            updateVisibility();

            // --- Export -------------------------------------------------
            $("#wsl-config-export-btn").on("click", function () {
                const distro = $("#node-config-input-distro").val();
                const file = $("#wsl-config-export-file").val();
                if (!distro) {
                    RED.notify("Distro name is not specified.", "error");
                    return;
                }
                if (!file) {
                    RED.notify("Export file path is not specified.", "error");
                    return;
                }

                const btn = $(this);
                btn.prop("disabled", true).html('<i class="fa fa-spinner fa-spin"></i> Exporting...');
                $.ajax({
                    url: "wsl-config/export",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ distro: distro, file: file }),
                    success: function () {
                        RED.notify("Exported \"" + distro + "\" to " + file, "success");
                        btn.prop("disabled", false).html('<i class="fa fa-download"></i> Export');
                    },
                    error: function (jqXHR) {
                        const errMsg = jqXHR.responseJSON ? jqXHR.responseJSON.error : "Unknown error";
                        RED.notify("Failed to export: " + errMsg, "error");
                        btn.prop("disabled", false).html('<i class="fa fa-download"></i> Export');
                    }
                });
            });

            // --- Unregister ---------------------------------------------
            $("#wsl-config-unregister-btn").on("click", function () {
                const distro = $("#node-config-input-distro").val();
                if (!distro) {
                    RED.notify("Distro name is not specified.", "error");
                    return;
                }

                var confirmMsg = "Are you sure you want to unregister \"" + distro + "\"?\nThis will run: wsl --unregister " + distro;
                if (!confirm(confirmMsg)) {
                    return;
                }

                var btn = $(this);
                btn.prop("disabled", true).text("Unregistering...");

                // Get install path first, then unregister
                $.getJSON("wsl-config/distro-path/" + encodeURIComponent(distro), function (pathData) {
                    $.ajax({
                        url: "wsl-config/unregister",
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ distro: distro }),
                        success: function (resp) {
                            RED.notify("Unregistered: " + distro, "success");
                            btn.prop("disabled", false).html('<i class="fa fa-trash"></i> Unregister');
                            loadDistros();

                            // Ask about folder deletion if path is available
                            if (pathData.path) {
                                var deleteMsg = "The installation folder still exists:\n" + pathData.path + "\n\nDo you want to delete this folder?";
                                if (confirm(deleteMsg)) {
                                    $.ajax({
                                        url: "wsl-config/delete-folder",
                                        type: "POST",
                                        contentType: "application/json",
                                        data: JSON.stringify({ path: pathData.path }),
                                        success: function () {
                                            RED.notify("Folder deleted: " + pathData.path, "success");
                                        },
                                        error: function (jqXHR) {
                                            var errMsg = jqXHR.responseJSON ? jqXHR.responseJSON.error : "Unknown error";
                                            RED.notify("Failed to delete folder: " + errMsg, "error");
                                        }
                                    });
                                }
                            }
                        },
                        error: function (jqXHR) {
                            var errMsg = jqXHR.responseJSON ? jqXHR.responseJSON.error : "Unknown error";
                            RED.notify("Failed to unregister: " + errMsg, "error");
                            btn.prop("disabled", false).html('<i class="fa fa-trash"></i> Unregister');
                        }
                    });
                }).fail(function () {
                    // Path lookup failed, proceed with unregister without folder deletion
                    $.ajax({
                        url: "wsl-config/unregister",
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ distro: distro }),
                        success: function (resp) {
                            RED.notify("Unregistered: " + distro, "success");
                            btn.prop("disabled", false).html('<i class="fa fa-trash"></i> Unregister');
                            loadDistros();
                        },
                        error: function (jqXHR) {
                            var errMsg = jqXHR.responseJSON ? jqXHR.responseJSON.error : "Unknown error";
                            RED.notify("Failed to unregister: " + errMsg, "error");
                            btn.prop("disabled", false).html('<i class="fa fa-trash"></i> Unregister');
                        }
                    });
                });
            });
        }
    });
</script>

<script type="text/html" data-template-name="wsl-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Config name">
    </div>

    <div class="form-row">
        <label for="node-config-input-sourceType"><i class="fa fa-cubes"></i> Source</label>
        <select id="node-config-input-sourceType" style="width:70%;">
            <option value="existing">Use existing distribution</option>
            <option value="file">Import from local image file</option>
            <option value="download">Download &amp; install clean Ubuntu</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-config-input-distro"><i class="fa fa-linux"></i> Distro</label>
        <input type="text" id="node-config-input-distro" list="wsl-distro-list" placeholder="e.g. Ubuntu-22.04">
        <datalist id="wsl-distro-list"></datalist>
        <div class="form-tips">For existing distributions, pick from the list. For import/download, this is the new distribution name.</div>
    </div>

    <div class="form-row wsl-src-file">
        <label for="node-config-input-sourceFile"><i class="fa fa-file-archive-o"></i> Image file</label>
        <input type="text" id="node-config-input-sourceFile" placeholder="e.g. C:\backup\ubuntu.tar.gz">
    </div>

    <div class="form-row wsl-src-download">
        <label for="node-config-input-sourceRelease"><i class="fa fa-cloud-download"></i> Ubuntu image</label>
        <select id="node-config-input-sourceRelease" style="width:70%;"></select>
    </div>

    <div class="form-row wsl-src-download">
        <label for="node-config-input-imageLocation"><i class="fa fa-folder"></i> Image folder</label>
        <input type="text" id="node-config-input-imageLocation" placeholder="e.g. C:\wsl\images (optional)">
        <div class="form-tips">Folder where the downloaded <code>.tar.gz</code> image file is saved. If set, the image is kept and reused for later imports. If empty, a temporary file is used and deleted after import.</div>
    </div>

    <div class="form-row wsl-src-location">
        <label for="node-config-input-installLocation"><i class="fa fa-folder-open"></i> Install to</label>
        <input type="text" id="node-config-input-installLocation" placeholder="e.g. C:\wsl\Ubuntu-24.04 (optional)">
        <div class="form-tips">Folder where the WSL environment (virtual disk) is created. Defaults to <code>&lt;home&gt;\wsl\&lt;distro&gt;</code> if empty.</div>
    </div>

    <div class="form-row wsl-src-location">
        <div class="form-tips" style="margin-left: 105px;">
            <i class="fa fa-info-circle"></i> The distribution is downloaded/imported automatically when the flow is <b>deployed</b>, if it is not installed yet. Progress ("Downloading image...", "Importing...") is shown as the status of <b>wsl-ubuntu</b> nodes using this config. Deleting this config node also unregisters the distribution it created.
        </div>
    </div>

    <hr/>
    <h4 style="margin-left: 105px;"><i class="fa fa-download"></i> Export</h4>
    <div class="form-row">
        <label for="wsl-config-export-file"><i class="fa fa-file-archive-o"></i> To file</label>
        <input type="text" id="wsl-config-export-file" placeholder="e.g. C:\backup\ubuntu.tar">
    </div>
    <div class="form-row">
        <button type="button" id="wsl-config-export-btn" class="red-ui-button" style="margin-left: 105px;">
            <i class="fa fa-download"></i> Export
        </button>
        <div class="form-tips">Exports the <b>Distro</b> selected above to a .tar file: <code>wsl --export</code></div>
    </div>

    <hr/>
    <h4 style="margin-left: 105px;"><i class="fa fa-trash"></i> Unregister</h4>
    <div class="form-row">
        <button type="button" id="wsl-config-unregister-btn" class="red-ui-button" style="margin-left: 105px;">
            <i class="fa fa-trash"></i> Unregister
        </button>
        <div class="form-tips"><b>Warning:</b> Unregister will remove the WSL distribution. You will be asked whether to also delete the installation folder.</div>
    </div>
</script>

<script type="text/html" data-help-name="wsl-config">
    <p>Configuration node for selecting and managing WSL (Windows Subsystem for Linux) distributions, used to manage multiple Ubuntu environments.</p>

    <h3>Source</h3>
    <p>Choose how the environment is provisioned:</p>
    <ul>
        <li><b>Use existing distribution</b> &ndash; point at a distribution already installed (detected with <code>wsl -l -v</code>).</li>
        <li><b>Import from local image file</b> &ndash; create a new distribution from a <code>.tar</code>/<code>.tar.gz</code> image on disk (<code>wsl --import</code>).</li>
        <li><b>Download &amp; install clean Ubuntu</b> &ndash; download an official Ubuntu WSL <code>.tar.gz</code> image from the internet and import it. Only WSL-targeted releases are offered (currently 22.04 and 24.04; Ubuntu 20.04 has no WSL image).</li>
    </ul>

    <h3>Provisioning</h3>
    <p>For the import and download options, provisioning runs automatically when the flow is <b>deployed</b> and the distribution is not installed yet. While it runs, <code>wsl-ubuntu</code> nodes using this config show the progress as their node status ("Downloading image...", "Importing...") and reject commands until the environment is ready.</p>
    <ul>
        <li><b>Image folder</b> &ndash; where the downloaded image file is saved. If set, the file is kept and reused; if empty, a temporary file is used and deleted after import.</li>
        <li><b>Install to</b> &ndash; where the WSL environment (virtual disk) is created. Defaults to <code>&lt;home&gt;\wsl\&lt;distro&gt;</code>.</li>
    </ul>

    <h3>Deleting the config node</h3>
    <p>When a config node whose source is import/download is deleted (and the change is deployed), the distribution it created is automatically removed with <code>wsl --unregister</code>. Config nodes that reference an existing distribution leave it untouched.</p>

    <h3>Export</h3>
    <p>Exports the selected <b>Distro</b> to a <code>.tar</code> image file by running <code>wsl --export &lt;distro&gt; &lt;file&gt;</code>. Large distributions may take several minutes.</p>

    <h3>Unregister</h3>
    <p>The "Unregister" button removes the WSL distribution by running <code>wsl --unregister</code>. After unregistering, you will be asked whether to also delete the installation folder (the absolute path will be shown).</p>
</script>
